
[project]
name = "psychopy-app"
dynamic = ["version"]
requires-python = ">=3.10, <3.13"
description = "The PsychoPy App is the wxPython application to support the PsychoPy lib but also see PsychoPy Studio"
readme ={file = "README.md", content-type = "text/markdown"}
license = "GPL-3.0-or-later"
authors = [
    {name = "Open Science Tools Ltd", email = "support@opensciencetools.org"},
]
maintainers = [
    {name = "Open Science Tools Ltd", email = "support@opensciencetools.org"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering",
    ]
dependencies = [
    "psychopy",
    "websockets==16.0",  # new in 2023.2 for session.py
    # for the app
    "wxPython==4.2.5",
    "markdown-it-py==4.2.0",
    "requests==2.34.2",
    "future==1.0.0",  # only to support legacy versions in useVersion
    # supporting plugins
    "setuptools==82.0.1",
    # pavlovia connections
    "python-gitlab==8.4.0",
    "gitpython==3.1.50",
    # psychoJS conversions
    "astunparse==1.6.3",
    "esprima==4.0.1",
    "jedi==0.20.0",
    "packaging==26.2",
    "beautifulsoup4==4.15.0",
    "pytz==2026.2",
]

[project.optional-dependencies]  # This is optional dependencies
tests = [
    "pytest>=6.2.5",
    "pytest-codecov",
    "pytest-cov",
    "pytest-asyncio",
    "flake8",
    "xmlschema",
]
building = [
    "bdist-mpkg>=0.5.0; platform_system == \"Darwin\"",
    "py2app; platform_system == \"Darwin\"",
    "dmgbuild; platform_system == \"Darwin\"",
    "polib",
]

[project.urls]
Homepage = "https://www.psychopy.org/"
Download = "https://github.com/psychopy/psychopy/releases/"

[project.gui-scripts]
psychopy = "psychopy_app:main"

[build-system]
requires = [
    "pdm-backend",
    "psychopy",  # to get version string
    "distro; platform_system == \"Linux\"",
    "tomlkit",
    "packaging",
    "six",  # for configobj
    "polib", # for compiling translation files (*.po)
    "typing-extensions",
]
build-backend = "pdm.backend"

[tool.uv]
exclude-newer = "7 days"
exclude-newer-package = { psychopy = false }

[tool.pdm.build]
includes = []
excludes = ["building/"]
#source-includes = ["tests/"]

[tool.pdm.version]
source = "call"
getter = "psychopy.__init__:getVersion"

[pytest]
minversion = "9.0"
addopts = ["-rP", "--import-mode=importlib"]
testpaths = [
    "tests",
]
pythonpath = ["src"]