
name: Publish package

on:
    workflow_dispatch:
      inputs:
        tag: 
          description: Tag to build release from
          required: true
    release:
        types: [released]

permissions:
  contents: read

jobs:
    pypi_publish:
        runs-on: ubuntu-latest
        environment: pypi
        permissions:
          id-token: write
          contents: write 
        steps:
        - name: Checkout (from release)
          if: ${{ startsWith(github.ref, 'refs/tags/') }}
          uses: actions/checkout@v4
          with:
            ref: ${{ github.ref_name }}
        
        - name: Checkout (from inputs)
          if: ${{ !startsWith(github.ref, 'refs/tags/') }}
          uses: actions/checkout@v4
          with:
            ref: ${{ github.event.inputs.tag }}

        - name: Setup Python
          uses: actions/setup-python@v3
          with:
            python-version: '3.10'

        - name: Install UV
          uses: astral-sh/setup-uv@v7
          with:
            activate-environment: true

        - name: Install packages
          run: |
            uv pip install build twine wheel pdm pdm-backend polib six
        
        - name: Install PsychoPy (from release)
          if: ${{ startsWith(github.ref, 'refs/tags/') }}
          run: |
            uv pip install --no-deps git+https://github.com/psychopy/psychopy.git@${{ github.ref_name }}  # just for the version number
        
        - name: Install PsychoPy (from tag)
          if: ${{ !startsWith(github.ref, 'refs/tags/') }}
          run: |
            uv pip install --no-deps git+https://github.com/psychopy/psychopy.git@${{ github.event.inputs.tag }}  # just for the version number

        - name: Build
          run: |
            # build with no-build-isolation to avoid installing build dependencies (slow on linux)
            uv build --no-build-isolation --wheel --sdist
                
        - name: Attach binaries
          if: startsWith(github.ref, 'refs/tags/')
          uses: softprops/action-gh-release@v2
          with:
            token: ${{ secrets.GITHUB_TOKEN }}
            files: |
              dist/*
        
        - name: Upload to PyPi
          uses: pypa/gh-action-pypi-publish@release/v1

        - name: Upload to GH Artifacts
          if: always()
          uses: actions/upload-artifact@v4
          with:
            path: |
              dist/*